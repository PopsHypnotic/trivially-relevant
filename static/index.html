<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivially Relevant</title>
    <link rel="stylesheet" href="/static/style.css">
    <script async src="https://media.ethicalads.io/media/client/ethicalads.min.js"></script>
</head>
<body>
    <div id="mesh-gradient"></div>
    
    <div class="ui-layer">
        <div class="brand-block">
            <span class="brand-text">Trivially <b>Relevant</b></span>
        </div>

        <div id="fact-container">
            <div id="fact-text">Reach into the void.</div>
            <div class="button-stack">
                <button id="share-btn">Capture Discovery</button>
            </div>
        </div>

        <div class="ad-placement-wrapper">
            <div data-ea-publisher="YOUR_PUBLISHER_SLUG" data-ea-type="image" id="ethicalads-container"></div>
        </div>

        <div class="hint">Tap Anywhere</div>
    </div>

    <div id="loader-overlay" class="loader-hidden">
        <div class="pulse"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
